[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ml4science"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.8",
    "jupyter>=1.1.1",
    "kaggle>=1.7.4.5",
    "kagglehub[pandas-datasets]>=0.3.13",
    "lightgbm>=4.6.0",
    "lime>=0.2.0.1",
    "optuna>=4.6.0",
    "phik>=0.12.5",
    "plotly>=6.3.1",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "tabulate>=0.9.0",
    "xgboost>=3.0.0,<3.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["eda_util"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
# Ignore ML/sklearn naming conventions (X, y, X_train, etc.)
ignore = ["N803", "N806"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pandas-stubs>=2.3.2.250926",
    "pre-commit>=4.3.0",
    "ruff>=0.14.3",
]
